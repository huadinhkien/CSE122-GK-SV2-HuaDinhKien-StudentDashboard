<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPath AI — Tổng quan sinh viên</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Topbar ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10L12 5 2 10l10 5 10-5z"/>
            <path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>
          </svg>
        </span>
        <span class="brand-name">StudyPath <strong>AI</strong></span>
      </a>

      <form class="topbar-search" id="search-form" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input type="search" id="global-search" placeholder="Tìm học phần, kế hoạch..." aria-label="Tìm kiếm">
      </form>

      <div class="topbar-right">
        <button class="icon-btn" id="btn-bell" aria-label="Thông báo">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </button>
        <div class="user-block">
          <div class="user-text">
            <strong>Hứa Đình Kiên</strong>
            <span>2551060707</span>
          </div>
          <div class="avatar" aria-hidden="true">K</div>
        </div>
      </div>
    </div>
  </header>

  <div class="app-shell">

    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" aria-label="Điều hướng chính">
      <p class="side-label">KHÔNG GIAN HỌC TẬP</p>

      <a class="side-item active" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Tổng quan</span>
      </a>
      <a class="side-item" href="#">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        <span>Kế hoạch học kỳ</span>
      </a>
      <a class="side-item" href="#">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.2 2.2M16.2 16.2l2.2 2.2M18.4 5.6l-2.2 2.2M7.8 16.2l-2.2 2.2"/></svg>
        <span>Lộ trình AI</span>
      </a>
      <a class="side-item" href="#">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span>Thông báo</span>
        <span class="badge" id="notif-badge">3</span>
      </a>
      <a class="side-item" href="#">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Cài đặt</span>
      </a>

      <div class="side-progress">
        <p class="side-progress-title">Tiến độ toàn khóa</p>
        <div class="progress"><div class="progress-fill" style="width:64.6%"></div></div>
        <p class="side-progress-text">84 / 130 tín chỉ · 64.6%</p>
      </div>
    </nav>

    <!-- ===== Main ===== -->
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Xin chào, Kiên 👋</h1>
          <p class="page-sub">Học kỳ hiện tại - <strong>HK1 2026–2027</strong></p>
        </div>
        <div class="page-actions">
          <div class="state-switch" role="group" aria-label="Chuyển trạng thái demo">
            <button type="button" data-state="normal" class="active">Bình thường</button>
            <button type="button" data-state="loading">Đang tải</button>
            <button type="button" data-state="empty">Rỗng</button>
            <button type="button" data-state="error">Lỗi</button>
          </div>
          <button type="button" class="btn btn-primary" id="btn-new-plan">+ Lập kế hoạch học kỳ</button>
        </div>
      </div>

      <div id="dashboard-content" aria-live="polite"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/main.js"></script>
</body>
</html>
